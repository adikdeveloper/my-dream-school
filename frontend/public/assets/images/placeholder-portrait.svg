  </defs>
  <rect width="600" height="800" fill="url(#grid)"/>
  <circle cx="70" cy="80" r="180" fill="#ffffff" fill-opacity=".14"/>
  <circle cx="560" cy="740" r="220" fill="#ffffff" fill-opacity=".12"/>
  <rect width="600" height="800" fill="url(#sheen)"/>
