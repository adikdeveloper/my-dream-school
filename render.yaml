services:
  - type: web
    name: my-dream-school-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        # Maxfiy — Render dashboard'da qo'lda kiritiladi (faylga yozilmaydi, GitHub'ga tushmaydi)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RECAPTCHA_ENABLED
        value: true
      - key: RECAPTCHA_REQUIRED
        value: true
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RECAPTCHA_MIN_SCORE
        value: 0.5
